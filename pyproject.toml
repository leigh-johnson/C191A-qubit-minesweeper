[project]
name = "C191A-qubit-minesweeper"
version = "0.1.0"
description = ""
authors = [{ name = "Leigh Zaman leighzaman@berkeley.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "stim (==1.16.dev1761611832)",
    "pulser (>=1.6.2,<2.0.0)",
    "pymatching (>=2.3.1,<3.0.0)",
    "sinter (==1.16.dev1761611832)",
    "numpy (==2.2.6)",
    "mwpf[stim] (>=0.2.12,<0.3.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["ipykernel (>=7.0.1,<8.0.0)", "pytest (>=9.0.1,<10.0.0)"]

[tool.poetry]
packages = [{ include = "src" }]
